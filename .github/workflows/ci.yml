name: CI and deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Re-record e2e screenshot baselines (uploaded as the "snapshots" artifact, no deploy)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://example.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    # Pinned: screenshot baselines depend on the OS image's font rendering.
    runs-on: ubuntu-24.04
    needs: check
    env:
      SITE_URL: https://example.com
      UPDATE_SNAPSHOTS: ${{ inputs.update-snapshots }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            npm run test:e2e -- --update-snapshots=all
          else
            npm run test:e2e
          fi
      - name: Upload new baselines
        if: env.UPDATE_SNAPSHOTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: e2e/**/*-linux.png
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  deploy:
    if: github.event_name != 'pull_request' && !inputs.update-snapshots && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check SITE_URL
        if: vars.SITE_URL == ''
        run: |
          echo "::error::Repository variable SITE_URL is not set (Settings → Secrets and variables → Actions → Variables). Without it canonical, hreflang and sitemap would point to example.com."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
